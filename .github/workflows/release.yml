name: Release

# Dispatched at the new version tag by the auto-tag workflow, or triggered by a manual
# version-tag push. The shared workflow loads Apple and Tauri signing credentials from Azure
# Key Vault through GitHub OIDC, builds a universal macOS app, and creates a draft release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: yoannchaudet/apple-signing-workflows/.github/workflows/release-macos-tauri.yml@403e40644f71c78edc241ac68cc4fc89d427974c
    with:
      release-name: Helix ${{ github.ref_name }}
      release-body: Download the `.dmg` below to install. Existing installs update automatically.
